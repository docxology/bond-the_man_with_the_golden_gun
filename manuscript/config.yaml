# ============================================================================
# PROJECT BOND · the_man_with_the_golden_gun — SOLEX mission manuscript config
# ----------------------------------------------------------------------------
# The Man with the Golden Gun (1974) · mission codename SOLEX.
# Manuscript {{TOKEN}} metrics are hydrated from this file + the deterministic
# domain models (src/the_man_with_the_golden_gun/manuscript_variables.py) —
# never hand-authored in prose. Published mirror; no archived deposit.
# ============================================================================

paper:
  title: "The Man with the Golden Gun: SOLEX — Special-Agent Mission Software"
  subtitle: "Heliostat Yield and Solar Tracking, Funhouse Lair Escape Topology and Flow Analysis, and Duel/Deadline Bounty Scheduling"
  version: "0.1.0"
  date: "2026-08-04"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

publication:
  # No archived deposit: DOI fields are intentionally omitted.
  journal: "PROJECT BOND — film mission dossiers"
  year: "2026"

mission:
  codename: "SOLEX"
  film: "the_man_with_the_golden_gun"
  # These six objectives are the MissionBrief objectives declared by
  # src/the_man_with_the_golden_gun/mission.py. tests/test_mission.py asserts
  # the two lists agree verbatim, so this block cannot drift from the provider.
  objectives:
    - "model solar concentration yield (mirror array to heat)"
    - "track solar position and daily clear-sky insolation"
    - "solve the funhouse lair escape topology (rooms/mirrors as graph)"
    - "analyse lair flow: edge-disjoint routes, min cut, cheapest escape"
    - "schedule the assassin duel/bounty appointment book"
    - "schedule unit-time deadline bounty contracts (max profit)"
  seed: 3
  design: >-
    Spencer/Duffie-Beckman solar geometry; greedy mirror-budget allocation;
    BFS escape routing with exact bottleneck removal; Edmonds-Karp max flow and
    min cut; Dijkstra cost-aware escape; weighted interval scheduling; deadline
    greedy with union-find.

keywords:
  - "solar concentration"
  - "heliostat field"
  - "thermal yield"
  - "solar position algorithms"
  - "clear-sky insolation"
  - "graph escape topology"
  - "bottleneck analysis"
  - "maximum flow and minimum cut"
  - "weighted interval scheduling"
  - "deadline scheduling"
  - "deterministic reproducible research"
  - "PROJECT BOND"

metadata:
  license: "MIT"
  language: "en"

# Enforced quality gates. `coverage_fail_under` is the number passed to
# `pytest --cov-fail-under` and is injected into the manuscript as
# {{COVERAGE_GATE_PCT}} so no section quotes a coverage threshold by hand.
gates:
  coverage_fail_under: 90
  mock_frameworks_allowed: 0

# Declared canonical inputs. Every key in this block is verified at token
# generation time by `manuscript_variables.verify_declared_experiment()`: each
# declared value is recomputed from the domain models and a disagreement
# raises, so this block is a checked restatement rather than inert
# documentation. The check is exhaustive by construction — the verifier
# enumerates the leaf keys actually present here and raises if it finds one it
# has no recomputation for, so adding an unverifiable key breaks the build
# rather than quietly widening the unchecked surface. `data_ledger` is verified
# by recomputing every claim in the file it names (see
# `declarations.verify_claim_ledger`), not merely by checking the path exists.
experiment:
  codename: "SOLEX"
  daily_dni_w_per_m2: 1000.0
  receiver_area_m2: 5.0
  lair_entry: "Entrance"
  lair_exit: "Vault"
  duel_max_bounty: 13.0
  data_ledger: "data/claim_ledger.yaml"
  # Solar-tracking site geometry (canonical island: ~8°N, June solstice).
  solar_tracking:
    latitude_deg: 8.0
    day_of_year: 172
    dni_peak_w_m2: 1000.0
    solar_constant_w_m2: 1361.0
    clearness: 0.75
  # Unit-time deadline bounty contracts (deadline slots, profit).
  deadline_jobs:
    - {id: A, deadline: 1, profit: 3.0}
    - {id: B, deadline: 2, profit: 5.0}
    - {id: C, deadline: 2, profit: 6.0}
    - {id: D, deadline: 3, profit: 2.0}
    - {id: E, deadline: 3, profit: 7.0}
  # Extended funhouse lair flow fixture.
  extended_lair:
    entry: "Entry"
    exit: "Vault"
    edge_disjoint_routes: 3
